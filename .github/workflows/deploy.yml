name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-main
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT_ID != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' && vars.GCP_RUNTIME_SA != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: southamerica-west1
      REPOSITORY: fork-red
      SERVICE: fork-red
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate with Google Cloud using OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push container
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build --pull --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy the new revision
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SA" \
            --execution-environment gen1 \
            --cpu 0.5 \
            --memory 256Mi \
            --concurrency 1 \
            --min-instances 0 \
            --max-instances 1 \
            --port 8080 \
            --timeout 60s \
            --ingress all \
            --quiet

      - name: Enforce service scale limit
        run: gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --min 0 --max 1 --quiet
